  <div class="sandbox">
    <h2>연습용 화면 — 아래 코드가 손댈 요소들입니다. 마음대로 고쳐 보세요.</h2>
    <h1 id="title">제목 h1</h1>
    <p id="name">이름</p>
    <p id="price">12000</p>
    <div class="box">div.box</div>

    <ul id="list" class="list">
      <li>목록 1</li>
      <li>목록 2</li>
      <li>목록 3</li>
    </ul>

    <form id="myForm">
      <input type="text" name="name" placeholder="이름">
      <label><input type="checkbox" id="agree"> 동의합니다</label>
      <button type="button" id="btn">버튼</button>
    </form>
  </div>

  <script>
    const products = [
    { id: 1, name: "노트북", price: 1200000, stock: 5 },
    { id: 2, name: "마우스", price: 35000, stock: 0 },
    { id: 3, name: "키보드", price: 89000, stock: 12 },
    { id: 4, name: "모니터", price: 350000, stock: 3 }
];

// ① 총 재고 금액 (가격 * 재고의 총합)
const totalInventoryPrice = products.reduce((sum, p) => sum + (p.price * p.stock), 0);

// ② 재고가 0인 상품 이름
const outOfStockProducts = products.filter(p => p.stock === 0).map(p => p.name);

// ③ 가장 비싼 상품 (원본 배열을 훼손하지 않도록 스프레드 연산자 [...]로 복사 후 정렬)
const mostExpensive = [...products].sort((a, b) => b.price - a.price)[0];

// 결과 출력하기
console.log(`① 총 재고 금액: ${totalInventoryPrice.toLocaleString()}원`);
console.log(`② 재고가 0인 상품 이름: ${outOfStockProducts.join(", ")}`);
